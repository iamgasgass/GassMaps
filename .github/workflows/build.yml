name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build GassMaps.ipa (unsigned)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project GassMaps.xcodeproj \
            -scheme GassMaps \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project GassMaps.xcodeproj \
            -scheme GassMaps \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build | tee build/xcodebuild.log | grep -E "error:|warning: unable|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/DerivedData/Build/Products/Release-iphoneos/GassMaps.app

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/GassMaps.app Payload/
          # rimuove eventuali firme residue
          find Payload -name "_CodeSignature" -type d -prune -exec rm -rf {} +
          zip -qry GassMaps-unsigned.ipa Payload
          ls -lh GassMaps-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GassMaps-unsigned-ipa
          path: GassMaps-unsigned.ipa

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GassMaps-unsigned.ipa
          generate_release_notes: true
